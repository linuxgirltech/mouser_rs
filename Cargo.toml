[workspace]
resolver = "3"
members = ["crates/libmouser", "crates/mouserd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/linuxtechgirl/mouser_rs"

[workspace.dependencies]
libmouser = { path = "crates/libmouser", version = "0.1.0" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
zbus = { version = "6.2", default-features = false, features = [
    "tokio",
    "tokio-multithread",
    "service",
    "proxy",
] }
