<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC
        "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  DEVELOPMENT ONLY. Like data/udev/70-mouser-dev.rules, this must not ship.

  Policy for a `cargo build --features devel` mouserd, which owns
  org.freedesktop.ratbag_devel1 instead of org.freedesktop.ratbag1. The system
  bus denies owning a name unless a policy permits it, so without this file a
  devel build fails at startup with AccessDenied rather than anything that
  names the cause.

  The point of the devel name is that it does not collide with an installed
  ratbagd, so mouserd can be driven by Piper while ratbagd keeps serving the
  devices it already supports — and while `ratbagctl` remains available as an
  oracle to compare against.

  Install to /usr/share/dbus-1/system.d/ and remove it when you are done.
-->
<busconfig>

  <policy user="root">
    <allow own="org.freedesktop.ratbag_devel1"/>
    <allow send_destination="org.freedesktop.ratbag_devel1"/>
    <allow receive_sender="org.freedesktop.ratbag_devel1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.ratbag_devel1"/>
    <allow receive_sender="org.freedesktop.ratbag_devel1"/>
  </policy>

</busconfig>
