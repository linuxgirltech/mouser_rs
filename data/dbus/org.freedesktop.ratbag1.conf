<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC
        "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  System bus policy for mouserd. Install to /usr/share/dbus-1/system.d/.

  This mirrors what ratbagd ships: root may own the name, anyone may talk to
  it. That is deliberately permissive - the daemon is the thing standing
  between an unprivileged caller and raw HID access, so any authorisation
  belongs in mouserd, not here.

  NOTE FOR PACKAGERS: mouserd owns the same name ratbagd does, so the two
  cannot run at once and this file collides with libratbag's own copy. A
  package needs Conflicts=libratbag. For side-by-side development use the
  devel build and org.freedesktop.ratbag_devel1.conf instead.
-->
<busconfig>

  <policy user="root">
    <allow own="org.freedesktop.ratbag1"/>
    <allow send_destination="org.freedesktop.ratbag1"/>
    <allow receive_sender="org.freedesktop.ratbag1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.ratbag1"/>
    <allow receive_sender="org.freedesktop.ratbag1"/>
  </policy>

</busconfig>
